<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep midnight blue background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#141a30" />
      <stop offset="100%" stop-color="#080b14" />
    </radialGradient>
    
    <!-- Metallic gold gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>
    
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="70%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFF59D" />
    </linearGradient>

    <!-- Cyan neon glow gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00838F" stop-opacity="0.2" />
    </linearGradient>
    
    <!-- Soft dropshadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Neon cyan glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Cyan glowing predictions chart lines in the background -->
  <path d="M 120 380 L 180 320 L 260 340 L 320 230 L 390 200" fill="none" stroke="url(#cyanGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="180" cy="320" r="8" fill="#00E5FF" filter="url(#glow)" />
  <circle cx="260" cy="340" r="8" fill="#00E5FF" filter="url(#glow)" />
  <circle cx="320" cy="230" r="8" fill="#00E5FF" filter="url(#glow)" />
  <circle cx="390" cy="200" r="8" fill="#00E5FF" filter="url(#glow)" />

  <!-- A secondary predictions dotted path -->
  <path d="M 100 240 Q 180 150 280 200 T 420 120" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="8 8" stroke-opacity="0.4" />

  <g filter="url(#shadow)">
    <!-- Sleek Golden Soccer Ball Base -->
    <circle cx="256" cy="310" r="130" fill="url(#goldGrad)" stroke="#141a30" stroke-width="4" />
    
    <!-- Soccer ball pentagon pattern and seams -->
    <!-- Center pentagon -->
    <polygon points="256,260 294,288 280,332 232,332 218,288" fill="#141a30" opacity="0.15" stroke="url(#goldLight)" stroke-width="3" />
    
    <!-- Surrounding seam lines -->
    <line x1="256" y1="260" x2="256" y2="180" stroke="url(#goldLight)" stroke-width="3.5" />
    <line x1="294" y1="288" x2="370" y2="264" stroke="url(#goldLight)" stroke-width="3.5" />
    <line x1="280" y1="332" x2="336" y2="400" stroke="url(#goldLight)" stroke-width="3.5" />
    <line x1="232" y1="332" x2="176" y2="400" stroke="url(#goldLight)" stroke-width="3.5" />
    <line x1="218" y1="288" x2="142" y2="264" stroke="url(#goldLight)" stroke-width="3.5" />
    
    <!-- Perimeter soccer panels -->
    <path d="M 256 180 L 196 224 L 218 288" fill="none" stroke="url(#goldLight)" stroke-width="3.5" />
    <path d="M 256 180 L 316 224 L 294 288" fill="none" stroke="url(#goldLight)" stroke-width="3.5" />
    <path d="M 370 264 L 350 338 L 280 332" fill="none" stroke="url(#goldLight)" stroke-width="3.5" />
    <path d="M 336 400 L 256 425 L 176 400" fill="none" stroke="url(#goldLight)" stroke-width="3.5" />
    <path d="M 142 264 L 162 338 L 232 332" fill="none" stroke="url(#goldLight)" stroke-width="3.5" />
    
    <!-- Elegant stylized Golden Trophy Silhouette overlapping the ball -->
    <path d="
      M 216 160 
      C 216 130, 296 130, 296 160 
      C 296 210, 276 220, 276 240 
      L 276 260 
      C 286 264, 290 270, 290 280 
      L 290 290
      C 290 296, 280 300, 256 300
      C 232 300, 222 296, 222 290
      L 222 280
      C 222 270, 226 264, 236 260
      L 236 240
      C 236 220, 216 210, 216 160 Z" 
      fill="url(#goldLight)" stroke="#141a30" stroke-width="3" />
      
    <!-- Trophy Handles -->
    <path d="M 218 152 C 190 152, 190 190, 222 195" fill="none" stroke="url(#goldLight)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 294 152 C 322 152, 322 190, 290 195" fill="none" stroke="url(#goldLight)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Shiny details inside the trophy base -->
    <line x1="240" y1="280" x2="272" y2="280" stroke="#FFE082" stroke-width="2" />
    <line x1="245" y1="290" x2="267" y2="290" stroke="#FFE082" stroke-width="2" />
  </g>
  
  <!-- Subtle glowing star on top of the trophy representing championship -->
  <polygon points="256,98 261,110 274,110 263,118 267,130 256,122 245,130 249,118 238,110 251,110" fill="#FFF59D" filter="url(#glow)" />
</svg>