name = "sync-worker"
main = "src/index.ts"
compatibility_date = "2024-05-12"

[vars]
API_FOOTBALL_TOKEN = "dummy_token_for_api_football"

[triggers]
crons = ["*/30 * * * *"] # Every 30 minutes

[[kv_namespaces]]
binding = "DATA_KV"
id = "local-data-kv"

[[d1_databases]]
binding = "DB"
database_name = "prode_u_db"
database_id = "local-prode-u-db"
